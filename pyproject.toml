[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "branchlab"
version = "0.2.0"
description = "Finite CTL branching-time truth, complete fixed-point atlases and replay certificates"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
branchlab = "branchlab.__main__:main"
branchlab-fair = "branchlab.fair_cli:main"
[tool.setuptools]
packages = ["branchlab"]
